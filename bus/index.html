var state = { route:"tenpaku", dir:"out", stopIdx:0, dayMode:"auto" };

function toISODate(d){
  var y=d.getFullYear(), m=("0"+(d.getMonth()+1)).slice(-2), dd=("0"+d.getDate()).slice(-2);
  return y+"-"+m+"-"+dd;
}
function isWeekendToday(){
  var d = new Date();
  var day = d.getDay();
  var m = d.getMonth()+1, dt = d.getDate();
  var isObon = (m===8 && dt>=13 && dt<=15);
  var isNY = (m===12 && dt>=29) || (m===1 && dt<=3);
  var isHoliday = HOLIDAYS_2026.indexOf(toISODate(d)) !== -1;
  return day===0 || day===6 || isObon || isNY || isHoliday;
}
function effectiveDayType(){
  if(state.dayMode==="weekday") return "weekday";
  if(state.dayMode==="weekend") return "weekend";
  return isWeekendToday() ? "weekend" : "weekday";
}
function toMinutes(t){ var p = t.split(":"); return parseInt(p[0])*60+parseInt(p[1]); }

function renderRouteTabs(){
  var el = document.getElementById("routeTabs");
  el.innerHTML = "";
  ["tenpaku","nishiguchi"].forEach(function(r){
    var b = document.createElement("button");
    b.textContent = DATA[r].name;
    if(state.route===r) b.className = "active";
    b.onclick = function(){ state.route = r; state.dir="out"; state.stopIdx=0; renderAll(); };
    el.appendChild(b);
  });
}
function renderSelectors(){
  var dirSel = document.getElementById("dirSelect");
  var stopSel = document.getElementById("stopSelect");
  var routeData = DATA[state.route];
  var dayType = effectiveDayType();
  var outStops = routeData[dayType].out.stops;
  var inStops = routeData[dayType].in.stops;
  dirSel.innerHTML = "<option value='out'>"+outStops[0]+"→"+outStops[outStops.length-1]+"</option><option value='in'>"+inStops[0]+"→"+inStops[inStops.length-1]+"</option>";
  dirSel.value = state.dir;
  dirSel.onchange = function(){ state.dir = dirSel.value; state.stopIdx=0; renderAll(); };
  var stops = routeData[dayType][state.dir].stops;
  stopSel.innerHTML = stops.map(function(s,i){ return "<option value='"+i+"'>"+s+"</option>"; }).join("");
  if(state.stopIdx >= stops.length) state.stopIdx = 0;
  stopSel.value = state.stopIdx;
  stopSel.onchange = function(){ state.stopIdx = parseInt(stopSel.value); renderAll(); };
}
function renderDayTypeUI(){
  var dayType = effectiveDayType();
  var label = document.getElementById("dayTypeLabel");
  var autoIsWeekend = isWeekendToday();
  if(state.dayMode==="auto"){
    label.textContent = "今日は" + (autoIsWeekend ? "土休日ダイヤ（自動判定）" : "平日ダイヤ（自動判定）");
  } else {
    label.textContent = (dayType==="weekend" ? "土休日ダイヤ" : "平日ダイヤ") + "（手動指定）";
  }
  [["btnAuto","auto"],["btnWeekday","weekday"],["btnWeekend","weekend"]].forEach(function(pair){
    var b = document.getElementById(pair[0]);
    b.className = state.dayMode===pair[1] ? "daybtn active" : "daybtn";
  });
}
function renderResult(){
  var dayType = effectiveDayType();
  var routeData = DATA[state.route];
  var stops = routeData[dayType][state.dir].stops;
  var rows = parseRows(routeData[dayType][state.dir].rows);
  document.getElementById("stopNameLabel").textContent = stops[state.stopIdx];
  var now = new Date();
  var nowMin = now.getHours()*60 + now.getMinutes();
  var times = rows.map(function(r){ return r[state.stopIdx]; }).filter(Boolean);
  var future = times.filter(function(t){ return toMinutes(t) >= nowMin; });
  var nextTimeEl = document.getElementById("nextTime");
  var countdownEl = document.getElementById("nextCountdown");
  var noBusEl = document.getElementById("noBusMsg");
  var listEl = document.getElementById("upcomingList");
  if(future.length===0){
    nextTimeEl.textContent = "--:--";
    countdownEl.textContent = "";
    noBusEl.textContent = "本日の運行は終了しました";
    listEl.innerHTML = "";
    return;
  }
  noBusEl.textContent = "";
  var next = future[0];
  var diff = toMinutes(next) - nowMin;
  nextTimeEl.textContent = next;
  countdownEl.textContent = diff===0 ? "まもなく発車" : "あと" + diff + "分";
  listEl.innerHTML = future.slice(1,4).map(function(t){
    return "<div><span>"+t+"</span><span>あと"+(toMinutes(t)-nowMin)+"分</span></div>";
  }).join("");
}
function renderAll(){ renderRouteTabs(); renderSelectors(); renderDayTypeUI(); renderResult(); }

document.getElementById("btnAuto").onclick = function(){ state.dayMode="auto"; renderAll(); };
document.getElementById("btnWeekday").onclick = function(){ state.dayMode="weekday"; renderAll(); };
document.getElementById("btnWeekend").onclick = function(){ state.dayMode="weekend"; renderAll(); };

renderAll();
setInterval(renderResult, 30000);
})();
</script>
</body>
</html>
